name: Android build

on:
  push:
    branches: ["claude/**", "main"]
    tags: ["v*"]
  workflow_dispatch:

env:
  # Public fingerprint of the original Ezano TV signing certificate (0.3.x, 0.5.0+). Not a secret.
  EZANO_CERT_SHA256: 3beee9b145381faf84f202ac26755c4d489ee2a1ce847d449cca7d1cc22b9e73

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      HAS_SIGNING_KEY: ${{ secrets.EZANO_KEYSTORE_BASE64 != '' && secrets.EZANO_STORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.EZANO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.EZANO_STORE_PASSWORD }}
        run: |
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "::add-mask::$STORE_PASSWORD"
            echo "EZANO_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          else
            # No permanent key configured: sign with a one-off key. The APK installs, but the next
            # build's key differs, so updating from it needs an uninstall. Add the secrets to avoid that.
            echo "::warning::EZANO_KEYSTORE_BASE64 / EZANO_STORE_PASSWORD secrets are not set; signing with a one-off key."
            password="$(openssl rand -hex 16)"
            echo "::add-mask::$password"
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/release.jks" -alias ezano -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Ezano TV" -storepass "$password" -keypass "$password"
            echo "EZANO_STORE_PASSWORD=$password" >> "$GITHUB_ENV"
          fi
          echo "EZANO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests and release build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease

      - name: Package
        id: package
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          cp "$apk" dist/Ezano-TV.apk
          cp "$apk" "dist/Ezano-TV-$version.apk"
          git archive --format=zip --prefix="ezano-tv/" -o "dist/Ezano-TV-source-$version.zip" HEAD
          if [[ "$COMMIT_MESSAGE" == *"[release]"* && -f release/Ezano-TV.apk ]]; then
            # A release commit carries the APK signed offline with the original key. Publish it only
            # if its certificate and version match, so the release always installs over 0.3.x.
            signed=release/Ezano-TV.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$signed" | tee certs.txt
            grep -qi "SHA-256 digest: $EZANO_CERT_SHA256" certs.txt || { echo "::error::release/Ezano-TV.apk is not signed with the Ezano key"; exit 1; }
            "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$signed" | head -1 | tee badging.txt
            grep -q "versionName='$version'" badging.txt || { echo "::error::release/Ezano-TV.apk is not version $version"; exit 1; }
            cp "$signed" dist/Ezano-TV.apk
            cp "$signed" "dist/Ezano-TV-$version.apk"
          fi
          # In-app update feed, published with the release so .../releases/latest/download/update.json
          # always describes the latest release. It must describe the final dist/Ezano-TV.apk (after the
          # offline-signed replacement above), and its versionCode must match that APK exactly, or
          # installed apps would keep offering an update they already have.
          version_code="$(sed -n 's/.*versionCode *= *\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging dist/Ezano-TV.apk | head -1 | tee badging.txt
          grep -q "versionCode='$version_code'" badging.txt || { echo "::error::dist/Ezano-TV.apk is not version code $version_code"; exit 1; }
          python3 - "$version_code" "$version" <<'PY'
          import hashlib, json, os, re, sys
          code, name = int(sys.argv[1]), sys.argv[2]
          apk = "dist/Ezano-TV.apk"
          digest = hashlib.sha256()
          with open(apk, "rb") as f:
              for block in iter(lambda: f.read(1 << 20), b""):
                  digest.update(block)
          def plain(markdown):
              lines = []
              for line in markdown.splitlines():
                  s = line.strip()
                  if "Download Ezano-TV.apk" in s:
                      continue  # meaningless inside the app
                  s = re.sub(r"<[^>]+>", "", s)
                  s = re.sub(r"^#{1,6}\s*", "", s)
                  s = re.sub(r"^>\s?", "", s)
                  s = re.sub(r"^[-*+]\s+", "• ", s)
                  s = re.sub(r"!?\[([^\]]*)\]\([^)]*\)", r"\1", s)
                  s = re.sub(r"(\*\*|__)(.+?)\1", r"\2", s)
                  s = re.sub(r"(?<![\w*])\*(?!\s)(.+?)(?<!\s)\*(?![\w*])", r"\1", s)
                  lines.append(s.replace("`", ""))
              text = re.sub(r"\n{3,}", "\n\n", "\n".join(lines)).strip()
              if len(text) > 600:
                  cut = text[:600]
                  space = max(cut.rfind(" "), cut.rfind("\n"))
                  text = (cut[:space] if space > 400 else cut).rstrip() + "…"
              return text
          notes = ""
          if os.path.isfile("RELEASE_NOTES.md"):
              with open("RELEASE_NOTES.md", encoding="utf-8") as f:
                  notes = plain(f.read())
          feed = {
              "versionCode": code,
              "versionName": name,
              "apk": f"https://github.com/kingezano123/EzanoTV/releases/download/v{name}/Ezano-TV-{name}.apk",
              "sha256": digest.hexdigest(),
              "size": os.path.getsize(apk),
              "notes": notes,
          }
          with open("dist/update.json", "w", encoding="utf-8") as f:
              json.dump(feed, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          cat dist/update.json
          (cd dist && sha256sum *.apk *.zip update.json > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ezano-tv-apk
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # A commit message containing [stage] posts the built APK to a temporary pre-release
  # (never "latest") so it can be signed offline with the original key.
  stage:
    needs: build
    if: contains(github.event.head_commit.message, '[stage]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ezano-tv-apk
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: staging
          target_commitish: ${{ github.sha }}
          name: Staging build (not for install)
          body: Unsigned-for-release build of ${{ github.sha }} waiting to be signed. Install the latest release instead.
          prerelease: true
          make_latest: false
          files: dist/Ezano-TV.apk

  release:
    needs: build
    # A v* tag, or a branch commit whose message contains [release], publishes v<versionName>.
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ezano-tv-apk
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Ezano TV ${{ needs.build.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          make_latest: true

      - name: Remove the staging pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete staging --cleanup-tag --yes -R "${{ github.repository }}" || true
