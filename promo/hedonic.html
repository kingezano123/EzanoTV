const mat = (color, rough = .85, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: rough, ...extra });

// text → canvas texture (Amharic needs the Ethiopic web font)
function textCanvas(lines, { w = 1024, h = 256, font = '700 120px Ethi', color = '#2c2350', bg = null, radius = 40, stroke = null, align = 'center', lineH = 1.25 } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  if (bg) { g.fillStyle = bg; g.beginPath(); g.roundRect(0, 0, w, h, radius); g.fill(); }
  g.font = font + ', Inter, sans-serif'; g.textAlign = align; g.textBaseline = 'middle';
  const arr = Array.isArray(lines) ? lines : [lines];
  const size = parseFloat(font.match(/(\d+)px/)[1]);
  arr.forEach((ln, i) => {
    const y = h / 2 + (i - (arr.length - 1) / 2) * size * lineH;
    const x = align === 'center' ? w / 2 : align === 'left' ? 40 : w - 40;
    if (stroke) { g.lineWidth = size * .12; g.strokeStyle = stroke; g.lineJoin = 'round'; g.strokeText(ln, x, y); }
    g.fillStyle = color; g.fillText(ln, x, y);
  });
  return c;
}

}

  };
  const body = ext([[-2.15, .3], [-2.22, .62], [-2.12, .9], [-1.9, .98], [1.15, .99], [1.9, .86], [2.18, .7], [2.2, .38], [2.1, .3]], 1.62, paint, .1);

    const tl = box(.06, .12, .32, new THREE.MeshStandardMaterial({ color: '#d61f2a', emissive: '#b0101a', emissiveIntensity: .4 }), .03); tl.position.set(-2.21, .78, z); car.add(tl);
  }
  const grille = box(.05, .16, .9, dark, .02); grille.position.set(2.21, .52, 0); car.add(grille);
  for (const z of [-.45, .45]) { const seat = box(.45, .5, .48, mat('#3a3030', .9), .08); seat.position.set(-.25, .75, z); car.add(seat); }
  const wheel = new THREE.Mesh(new THREE.TorusGeometry(.17, .025, 8, 24), dark); wheel.position.set(.45, 1.02, .4); wheel.rotation.y = Math.PI / 2; wheel.rotation.x = -.4; car.add(wheel);

}
function sparkleTex() {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(255,244,200,.7)'); gr.addColorStop(1, 'rgba(255,240,200,0)');
  g.fillStyle = gr; g.beginPath(); g.moveTo(64, 0); g.quadraticCurveTo(70, 58, 128, 64); g.quadraticCurveTo(70, 70, 64, 128); g.quadraticCurveTo(58, 70, 0, 64); g.quadraticCurveTo(58, 58, 64, 0); g.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const SPARK = sparkleTex();
function sparkles(n, spread) {

    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: SPARK, transparent: true, depthWrite: false, toneMapped: false }));
    s.userData = { p: [(rnd() - .5) * spread[0], rnd() * spread[1], (rnd() - .5) * spread[2]], ph: rnd() * 6, sp: .7 + rnd() };
    g.add(s);
  }
  g.userData.update = (t, k) => g.children.forEach(s => {
    const u = s.userData, a = Math.max(0, Math.sin(t * 2.2 * u.sp + u.ph)) * k;
    s.position.set(...u.p); s.scale.setScalar(.05 + .32 * a); s.material.opacity = a;

}
function heartShape(size) {
  const s = new THREE.Shape(), x = 0, y = 0;
  s.moveTo(x, y + .25); s.bezierCurveTo(x, y + .25, x - .05, y, x - .25, y); s.bezierCurveTo(x - .55, y, x - .55, y + .35, x - .55, y + .35);
  s.bezierCurveTo(x - .55, y + .55, x - .35, y + .77, x, y + .95); s.bezierCurveTo(x + .35, y + .77, x + .55, y + .55, x + .55, y + .35);

  const g = new THREE.ExtrudeGeometry(s, { depth: .2, bevelEnabled: true, bevelThickness: .08, bevelSize: .06, bevelSegments: 5, curveSegments: 16 });
  g.center(); g.rotateZ(Math.PI); g.scale(size, size, size); return g;
}

function makeTree(s = 1, fruit = false) {

// ============================================================ STREET set
const street = new THREE.Group(); scene.add(street);
{
  const geo = new THREE.PlaneGeometry(300, 300, 120, 120); geo.rotateX(-Math.PI / 2);
  const p = geo.attributes.position, col = [], c = new THREE.Color();

    p.setY(i, far * (Math.sin(x * .06) * 3 + Math.cos(z * .05) * 2.5 + 2));
    const n = (Math.sin(x * .9) * Math.cos(z * .7) + Math.sin(x * .23 + z * .31)) * .5;
    c.set('#7fbf57').offsetHSL(n * .015, 0, n * .035 - far * .03); col.push(c.r, c.g, c.b);

// ---- poses
function poseIdle(t, ph = 0) {
  const b = Math.sin(t * 1.9 + ph) * .5 + .5, sway = Math.sin(t * .7 + ph);
  return { spine: [.01 * b, 0, .01 * sway], chest: [-.02 * b, 0, 0], neck: [0, 0, 0], head: [.02 * Math.sin(t * .6 + ph), .04 * Math.sin(t * .4 + ph), 0],
           hips: [0, 0, .015 * sway], hipsOffset: [.012 * sway, 0, 0] };
}
const STRIDE_WALK = 1.25, STRIDE_RUN = 1.95;
function poseWalk(dist, amp = 1) {
  const ph = dist / STRIDE_WALK * TAU, P = {};
  for (const [n, p] of [['L', ph], ['R', ph + Math.PI]]) {
    const c = Math.cos(p);
    P['thigh' + n] = [-.38 * amp * Math.sin(p) - .02, 0, 0];
    P['shin' + n] = [.12 + .6 * amp * Math.pow(Math.max(0, c), 1.6), 0, 0];
    P['foot' + n] = [.1 * Math.sin(p) - .12 * Math.max(0, c), 0, 0];
  }
  P.spine = [.04, -.05 * Math.sin(ph), 0]; P.chest = [0, -.05 * Math.sin(ph), 0]; P.hips = [0, .06 * Math.sin(ph), .02 * Math.cos(ph)];
  P.hipsOffset = [0, .02 * Math.abs(Math.sin(ph)) - .012, 0]; P._ph = ph;
  return P;
}
function poseRun(dist, amp = 1) {
  const ph = dist / STRIDE_RUN * TAU, P = {};
  for (const [n, p] of [['L', ph], ['R', ph + Math.PI]]) {
    const c = Math.cos(p);
    P['thigh' + n] = [-.62 * amp * Math.sin(p) - .08, 0, 0];
    P['shin' + n] = [.25 + 1.15 * amp * Math.pow(Math.max(0, c), 1.4), 0, 0];
    P['foot' + n] = [.18 * Math.sin(p) - .25 * Math.max(0, c), 0, 0];
  }
  P.spine = [.14, -.1 * Math.sin(ph), 0]; P.chest = [.04, -.12 * Math.sin(ph), 0]; P.hips = [0, .12 * Math.sin(ph), 0];
  P.neck = [-.1, 0, 0]; P.hipsOffset = [0, .045 * Math.abs(Math.sin(ph)) - .03, 0]; P._ph = ph; P._run = 1;
  return P;
}
function poseSit(t, ph = 0, h = .5) {   // h: how far the hips drop
  const P = poseIdle(t, ph);
  for (const n of ['L', 'R']) { P['thigh' + n] = [-1.5, 0, n === 'L' ? -.06 : .06]; P['shin' + n] = [1.5, 0, 0]; P['foot' + n] = [0, 0, 0]; }
  P.hipsOffset = [0, -h, -.03]; P.spine = [.05, 0, 0];
  return P;
}
function poseCrouch(t) {
  const P = poseIdle(t);
  for (const n of ['L', 'R']) { P['thigh' + n] = [-1.35, 0, n === 'L' ? -.15 : .15]; P['shin' + n] = [2.1, 0, 0]; P['foot' + n] = [-.55, 0, 0]; }
  P.hipsOffset = [0, -.5, -.15]; P.spine = [.45, 0, 0]; P.chest = [.2, 0, 0]; P.neck = [-.2, 0, 0];
  return P;
}

      act(wife, { pos: [-2.0, -1.6], y: .26, yaw: 0, pose: poseSit(t, 1, .73), arms: 'lap', face: { smile: 1 }, head: [0, -.25], look: [-.4, 0], t });
      act(friend, { pos: [.1, -1.3], yaw: -.4, pose: poseIdle(t, 2), arms: 'hips', face: { smile: 1, open: .2 }, t });
      shotCam(lt, [[-.6, 1.45, 3.4], [-1.1, 1.05, -1.6]], [[3.5, 3.6, 15], [0, 2.0, -2]], ease, .4);
    } },
];
SHOTS.forEach(s => s.lightName = s.light);

// ---- per-frame drawing for the graph and treadmill display
function happiness(t) {
  let h = 0;
  for (const s of [68.4, 72.2, 76.2]) if (t > s) { const d = t - s; h += Math.min(1, d * 3) * Math.exp(-d * .85) * 1.0; }
  return h;
}
function drawGraph(t) {
  const { c, tx } = S.graph.userData, g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 1600, 900);
  const X0 = 150, X1 = 1520, Y0 = 760, Y1 = 120, base = 560;
  g.strokeStyle = '#c9c0e6'; g.lineWidth = 6; g.beginPath(); g.moveTo(X0, Y1); g.lineTo(X0, Y0); g.lineTo(X1, Y0); g.stroke();
  g.fillStyle = '#5b2fb0'; g.font = '900 54px Ethi'; g.textAlign = 'left'; g.fillText('ደስታ', 30, 100); g.textAlign = 'right'; g.fillText('ጊዜ →', X1, 840);
  g.setLineDash([18, 14]); g.strokeStyle = '#b7aed6'; g.lineWidth = 5; g.beginPath(); g.moveTo(X0, base); g.lineTo(X1, base); g.stroke(); g.setLineDash([]);
  g.fillStyle = '#8f86b3'; g.font = '700 38px Ethi'; g.textAlign = 'left'; g.fillText(t > 79 ? 'አዲሱ የተለመደ' : 'መነሻ ደረጃ', X0 + 20, base + 52);
  const t0 = 66.5, t1 = 80.5, now = Math.min(t, t1);
  g.strokeStyle = '#7b4fd1'; g.lineWidth = 14; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
  let lastX = X0, lastY = base;
  for (let tt = t0; tt <= now; tt += .03) { const x = X0 + (tt - t0) / (t1 - t0) * (X1 - X0), y = base - happiness(tt) * 380; tt === t0 ? g.moveTo(x, y) : g.lineTo(x, y); lastX = x; lastY = y; }
  g.stroke();
  g.fillStyle = '#ff5d7a'; g.beginPath(); g.arc(lastX, lastY, 18, 0, TAU); g.fill();
  const evs = [[68.4, 'የሥራ እድገት'], [72.2, 'የደመወዝ ጭማሪ'], [76.2, 'ትልቅ ቤት']];
  g.textAlign = 'center'; g.font = '900 40px Ethi';
  for (const [s, name] of evs) if (t > s) {
    const x = X0 + (s + .45 - t0) / (t1 - t0) * (X1 - X0), a = clamp((t - s) * 2);
    g.globalAlpha = a; g.fillStyle = '#e2711d'; g.beginPath(); g.roundRect(x - 150, 40, 300, 66, 33); g.fill(); g.fillStyle = '#fff'; g.fillText(name, x, 86); g.globalAlpha = 1;
  }
  tx.needsUpdate = true;
}
function drawTreadmill(t, dist) {
  const { dc, dtx } = S.treadmill.userData.disp, g = dc.getContext('2d');
  g.fillStyle = '#0d1a14'; g.fillRect(0, 0, 512, 256);
  g.fillStyle = '#4dff9a'; g.font = '700 44px Ethi'; g.textAlign = 'left'; g.fillText('ርቀት', 26, 70);
  g.font = '900 72px Ethi'; g.textAlign = 'right'; g.fillText(Math.floor(dist * 10) + ' ሜ', 490, 76);
  g.fillStyle = '#ff7a90'; g.font = '700 44px Ethi'; g.textAlign = 'left'; g.fillText('እርካታ', 26, 170);
  g.fillStyle = '#2a3a33'; g.fillRect(200, 140, 290, 44); g.fillStyle = '#ff7a90'; g.fillRect(200, 140, 290 * (.28 + .03 * Math.sin(t * 3)), 44);
  dtx.needsUpdate = true;
}

// =====================================================================  frame
window.DURATION = 180;
const studioParts = Object.keys(S).filter(k => !['cyc', 'floor'].includes(k));
window.renderAt = (t) => {
  const shot = SHOTS.find(s => t >= s.a && t < s.b) || SHOTS[SHOTS.length - 1], lt = (t - shot.a) / (shot.b - shot.a);
  street.visible = shot.set === 'street'; room.visible = shot.set === 'room'; studio.visible = shot.set === 'studio';
  for (const k of studioParts) S[k].visible = (shot.sub || []).includes(k);
  AV.forEach(a => a.group.visible = false);
  car.visible = false; bubble.visible = false; qmarks.forEach(q => q.visible = false); buna.visible = false; sapling.visible = false;
  hearts.forEach(h => h.visible = false); room.userData.fall.visible = false;
  street.userData.winM.emissiveIntensity = .2; street.userData.winM.emissive.set('#3c6a86');
  jarCoins.forEach(c => c.visible = true);
  shot.run(t, lt);
  camera.updateMatrixWorld();
  const focus = shot.set === 'street' ? V3(camera.position.x * .5 + 1, 0, camera.position.z * .3) : shot.set === 'room' ? V3(0, 0, -1.5) : V3(camera.position.x * .6, 0, 0);
  setLight(shot.light, focus);
  // overlays
  el('title').style.opacity = Math.min(sm(seg(t, .6, 1.6)), 1 - sm(seg(t, 5.0, 5.9)));
  el('title').style.transform = `scale(${1 + .04 * sm(seg(t, .6, 5.9))})`;
  setOverlay('cap', CAPS, t, (n, it) => { n.textContent = it[2]; });
  setOverlay('chip', CHIPS, t, (n, it) => { n.textContent = it[2]; });
  setOverlay('big', BIGS, t, (n, it) => { n.firstChild.textContent = it[2]; });
  setOverlay('tip', TIPS, t, (n, it) => { n.querySelector('.num').textContent = it[2]; n.querySelector('.txt').textContent = it[3]; });
  // scene transitions: dip to black at scene boundaries, fade in/out
  let fade = 1 - sm(seg(t, 0, 1.0));
  for (const b of [45.2, 90.2, 135.2]) fade = Math.max(fade, 1 - sm(Math.abs(t - b) / .45));
  fade = Math.max(fade, sm(seg(t, 179, 180)));
  el('fade').style.opacity = fade;
  renderer.render(scene, camera);
};
window.renderAt(Number(Q.get('t') || 0));
window.READY = true;
</script>
