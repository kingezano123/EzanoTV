const greens = ['#6db14b', '#7fc05a', '#5fa544', '#8ccb66'];
function tree(x, z, s = 1) {

    m.position.set((rnd() - .5) * 1.3 * s, h + r * .45 + i * .35 * s, (rnd() - .5) * 1.0 * s);

  g.fillStyle = lg; g.fillText('EZANO', 50, 62); g.fillStyle = '#fff'; g.fillText('TV', 178, 62);

  g.font = '700 22px Inter'; g.fillText('Play', 124, 410);
  rr(225, 375, 170, 54, 12); g.fillStyle = 'rgba(255,255,255,.22)'; g.fill(); g.fillStyle = '#fff'; g.fillText('More info', 254, 410);
  for (let i = 0; i < 3; i++) { g.fillStyle = i === fi ? '#fff' : 'rgba(255,255,255,.35)'; rr(60 + i * 26, 455, i === fi ? 20 : 10, 8, 4); g.fill(); }
  g.fillStyle = '#fff'; g.font = '700 22px Inter'; g.fillText('Continue Watching', 60, 520);
  const cols = [[VIOLET, '#2b1b6b'], [CYAN, '#0b3a4a'], [PINK, '#4a0b2e'], ['#ffb547', '#4a2c0b'], ['#5eead4', '#0b3a33'], ['#a78bfa', '#2a1b5e']];
  for (let i = 0; i < 6; i++) {

}

{
  const red = clay('#d9463e', .5), tire = clay('#1c1c1c', .8), steel = clay('#b8bcc2', .35);
  const tube = (a, b, r, mat) => {
    const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 10), mat);
    m.position.copy(A).add(B).multiplyScalar(.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); bike.add(m); return m;
  };
  for (const wx of [-.62, .72]) {
    const w = new THREE.Group(); w.position.set(wx, .5, 0);
    const t = new THREE.Mesh(new THREE.TorusGeometry(.46, .045, 12, 40), tire); w.add(t);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(.42, .012, 6, 40), steel); w.add(rim);
    for (let i = 0; i < 12; i++) {
      const s = new THREE.Mesh(new THREE.CylinderGeometry(.006, .006, .84, 4), steel); s.rotation.z = i * Math.PI / 12; w.add(s);
    }
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, .1, 10), steel); hub.rotation.x = Math.PI / 2; w.add(hub);
    bike.add(w); wheels.push(w);
  }
  const crank = [.02, .45, 0], seat = [-.26, 1.0, 0], headTop = [.58, 1.08, 0], headLow = [.62, .9, 0];
  tube(crank, seat, .035, red); tube(seat, headTop, .03, red); tube(crank, headLow, .035, red);
  tube(crank, [-.62, .5, 0], .025, red); tube([-.24, .95, 0], [-.62, .5, 0], .022, red);
  tube(headLow, [.72, .5, .06], .022, red); tube(headLow, [.72, .5, -.06], .022, red); tube(headTop, [.55, 1.28, 0], .025, steel);
  tube([.55, 1.28, -.3], [.55, 1.28, .3], .022, steel);
  for (const z of [-.3, .3]) tube([.55, 1.28, z * .85], [.55, 1.28, z * 1.15], .04, tire);
  const saddle = new THREE.Mesh(new RoundedBoxGeometry(.34, .07, .18, 3, .03), tire); saddle.position.set(-.28, 1.04, 0); bike.add(saddle);
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(.11, .11, .02, 20), steel); ring.rotation.x = Math.PI / 2; ring.position.set(...crank); ring.position.z = .07; bike.add(ring);
}
bike.add(kid); kid.position.set(-.3, -.03 / .6, 0); kid.rotation.y = Math.PI / 2; // kid faces bike-forward (+x)
shade(bike); scene.add(bike);

// two-bone IK for a pedalling leg (in the kid's local, unscaled space)
function ikLeg(leg, targetY, targetZ) {
  const hy = 1.62, L1 = .8, L2 = .92;
  const dy = targetY - hy, dz = targetZ, D = clamp(Math.hypot(dy, dz), .2, L1 + L2 - .02);
  const phiD = Math.atan2(-dz, -dy);
  const beta = Math.acos(clamp((L1 * L1 + D * D - L2 * L2) / (2 * L1 * D), -1, 1));
  const gamma = Math.acos(clamp((L1 * L1 + L2 * L2 - D * D) / (2 * L1 * L2), -1, 1));
  leg.hip.rotation.set(phiD - beta, 0, 0);
  leg.knee.rotation.set(Math.PI - gamma, 0, 0);
}

// floating confetti dots (like soft pollen / party specks)
const specks = [];
{
  const cols = ['#ffffff', '#b59cf0', '#f08a8a', '#9ad7f0', '#f5d36b'];
  for (let i = 0; i < 46; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(.035 + rnd() * .03, 10, 8), clay(cols[i % cols.length], .6));
    m.userData = { x: (rnd() - .5) * 18, y: .3 + rnd() * 3.5, z: -7 + rnd() * 8, p: rnd() * 6 };
    m.castShadow = false; scene.add(m); specks.push(m);
  }
}

// ---------- chunky title: green face, dark-brown extruded edge ----------
const letters = [];
{
  let font;
  try { const ttf = new TTFLoader(); ttf.reversed = true; font = new FontLoader().parse(ttf.parse(await (await fetch('./fonts/Inter-Black.otf')).arrayBuffer())); }
  catch (e) { console.log('ttf fallback', e.message); font = new FontLoader().parse(await (await fetch('./node_modules/three/examples/fonts/helvetiker_bold.typeface.json')).json()); }
  const face = new THREE.MeshStandardMaterial({ color: '#5fd18f', roughness: .55 });
  const side = new THREE.MeshStandardMaterial({ color: '#3b2416', roughness: .7 });
  const title = new THREE.Group();
  let x = 0; const size = 1.05, gap = .06;
  for (const ch of 'EZANO TV') {
    if (ch === ' ') { x += .42; continue; }
    const geo = new TextGeometry(ch, { font, size, depth: .32, curveSegments: 10, bevelEnabled: true, bevelThickness: .04, bevelSize: .035, bevelSegments: 3 });
    geo.computeBoundingBox(); const bb = geo.boundingBox; const w = bb.max.x - bb.min.x;
    geo.translate(-bb.min.x - w / 2, 0, -.16);
    const holder = new THREE.Group(); holder.position.x = x + w / 2;
    const m = new THREE.Mesh(geo, [face, side]); m.castShadow = true; holder.add(m);
    title.add(holder); letters.push(holder); x += w + gap;
  }
  letters.forEach(l => l.position.x -= x / 2);
  title.position.set(.8, 1.05, 2.4); title.rotation.x = -.06;
  scene.add(title);
}

// ---------- camera path (eased keyframes + gentle handheld drift) ----------
const keys = [
  { t: 0.0, p: [7.5, 3.6, 16], l: [-1.5, 1.6, -.5] },
  { t: 3.4, p: [-.3, 2.4, 6.6], l: [-5.2, 2.1, 1.0] },   // over to the TV screen
  { t: 5.6, p: [1.6, 2.3, 10.2], l: [.8, 1.9, 0] },      // swing round to the family
  { t: 10.0, p: [.8, 2.1, 10.4], l: [.8, 1.9, .3] },
];
function camAt(t) {
  let i = 0; while (i < keys.length - 2 && t > keys[i + 1].t) i++;
  const a = keys[i], b = keys[i + 1], k = ease(seg(t, a.t, b.t));
  const P = a.p.map((v, j) => lerp(v, b.p[j], k)), L = a.l.map((v, j) => lerp(v, b.l[j], k));
  P[0] += wobble(t * .6, 1) * .05; P[1] += wobble(t * .6, 2) * .04; L[0] += wobble(t * .5, 3) * .03;
  return [P, L];
}

// blink schedule (seconds) per character
const blinks = { dad: [1.9, 4.6, 7.3, 9.1], mom: [1.2, 3.8, 6.4, 8.6], kid: [3.0, 6.0, 8.0] };
const blinkAmt = (t, list) => list.reduce((m, b) => Math.max(m, 1 - Math.abs(t - b) / .09), 0);

function animatePerson(p, t, cfg) {
  const r = p.userData.rig;
  const breathe = Math.sin(t * 2.1 + cfg.phase) * .5 + .5;
  // turn from the TV to the camera: head leads, body follows
  const turnK = smooth(seg(t, cfg.turnAt, cfg.turnAt + .9));
  const headK = smooth(seg(t, cfg.turnAt - .25, cfg.turnAt + .45));
  const bodyYaw = lerp(cfg.watchYaw, cfg.endYaw, turnK);
  p.rotation.y = bodyYaw + wobble(t, cfg.phase) * .02;
  r.head.rotation.y = lerp(cfg.watchYaw, cfg.endYaw, headK) - bodyYaw + wobble(t * .8, cfg.phase + 2) * .05;
  r.head.rotation.x = wobble(t * .7, cfg.phase + 5) * .04 - .05;
  // weight shift + breathing
  const sway = Math.sin(t * .9 + cfg.phase);
  r.torso.position.x = sway * .03; r.torso.rotation.z = sway * .025;
  r.torso.scale.set(1, 1 + breathe * .012, 1 + breathe * .02);
  // cheer
  const up = spring(seg(t, cfg.cheerAt, cfg.cheerAt + .8));
  const bounce = Math.max(0, Math.sin((t - cfg.cheerAt) * 7.5)) * seg(t, cfg.cheerAt, cfg.cheerAt + .6);
  p.position.y = bounce * .09;
  r.legs.forEach(l => { l.hip.rotation.x = -bounce * .12; l.knee.rotation.x = bounce * .24; });
  r.arms.forEach((a, i) => {
    const restRaise = .12 + breathe * .015, restBend = .25;
    const both = cfg.style === 'both' || (cfg.style === 'wave' && i === 1);
    if (both) {
      const pump = Math.sin((t - cfg.cheerAt) * 7.5 + i * .5) * .12 * seg(t, cfg.cheerAt + .3, cfg.cheerAt + .9);
      arm(a, lerp(restRaise, 2.72 + pump, up), lerp(0, -.15, up), lerp(restBend, .35 - pump, up));
      if (cfg.style === 'wave') { const wv = Math.sin((t - cfg.cheerAt) * 8) * seg(t, cfg.cheerAt + .4, cfg.cheerAt + 1); a.sh.rotation.z = a.side * (lerp(restRaise, 2.55, up)); a.el.rotation.set(-lerp(restBend, .25, up), 0, a.side * wv * .45); }
    } else if (cfg.style === 'wave') {
      // free arm: relaxed, hand resting near the hip
      arm(a, restRaise + up * .1, -up * .1, restBend + up * .2);
    } else arm(a, restRaise, 0, restBend);
  });
  // face
  const bl = blinkAmt(t, cfg.blinks);
  r.eyes.forEach(e => { e.lid.rotation.x = lerp(-1.9, -.15, bl); e.pupil.position.x = Math.sin(t * .5 + cfg.phase) * .006; });
  r.mouth.scale.set(1 + up * .25, 1 + up * .9, 1);
}

// ---------- post-processing: ambient occlusion for grounded contact shading ----------
let composer = null;
if (USE_AO) {
  const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  const ao = new GTAOPass(scene, camera, W, H);
  ao.updateGtaoMaterial({ radius: .6, distanceExponent: 1.5, thickness: 1, scale: 1.2, samples: 12 });
  ao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 12 });
  ao.blendIntensity = .9;
  composer.addPass(ao);
  composer.addPass(new OutputPass());
}

// ---------- frame render ----------
window.DURATION = 10;
window.renderAt = (t) => {
  // TV powers on
  const power = seg(t, .7, 1.25);
  drawScreen(Math.max(0, t - .7), power);
  tvLight.intensity = power * 2.2;

  animatePerson(dad, t, { phase: 0, watchYaw: -1.25, endYaw: .12, turnAt: 4.7, cheerAt: 5.9, style: 'both', blinks: blinks.dad });
  animatePerson(mom, t, { phase: 2, watchYaw: -1.35, endYaw: -.12, turnAt: 4.95, cheerAt: 6.15, style: 'wave', blinks: blinks.mom });

  // kid rides along the path, right to left
  const ride = seg(t, 1.6, 10.0), dist = ride * 22;
  bike.position.set(11 - dist, 0, PATH_Z + .2);
  bike.rotation.y = Math.PI; bike.rotation.z = Math.sin(t * 2.2) * .015;
  wheels.forEach(w => w.rotation.z = -dist / .5);
  const crankA = -dist / .5 * .55, kr = kid.userData.rig, s = .6;
  kr.torso.rotation.x = .38; kr.torso.position.y = 1.62;
  kr.legs.forEach((l, i) => {
    const a = crankA + i * Math.PI;
    const px = .02 + Math.cos(a) * .17, py = .45 + Math.sin(a) * .17;
    ikLeg(l, (py + .03) / s - .05, (px + .3) / s);
    l.hip.rotation.y = 0;
  });
  kr.arms.forEach(a => { arm(a, .18, -1.05, .35); });
  kr.head.rotation.set(-.3, Math.sin(t * .8) * .1 - .35 * seg(t, 4.5, 6), 0);
  const kb = blinkAmt(t, blinks.kid); kr.eyes.forEach(e => e.lid.rotation.x = lerp(-1.9, -.15, kb));
  kr.mouth.scale.set(1.2, 1.4, 1);

  // nature: trees breathe in the breeze, specks drift
  trees.forEach(tr => { tr.rotation.z = Math.sin(t * 1.1 + tr.userData.sway) * .012; tr.rotation.x = Math.cos(t * .9 + tr.userData.sway) * .008; });
  specks.forEach(m => { const u = m.userData; m.position.set(u.x + Math.sin(t * .4 + u.p) * .4 + t * .12, u.y + Math.sin(t * .9 + u.p) * .25, u.z + Math.cos(t * .5 + u.p) * .3); });

  // title pops in letter by letter with a springy settle
  letters.forEach((l, i) => {
    const k = seg(t, 6.0 + i * .085, 6.0 + i * .085 + 1.1);
    const s = spring(k);
    l.visible = k > 0;
    l.scale.setScalar(Math.max(.001, s));
    l.position.y = (1 - easeOut(k)) * -1.2 + Math.sin(t * 2.2 + i * .6) * .04 * k;
    l.rotation.z = (1 - s) * .35 * (i % 2 ? 1 : -1);
  });

  const tg = ease(seg(t, 7.6, 8.3)), sb = ease(seg(t, 8.0, 8.7));
  document.getElementById('tag').style.opacity = tg;
  document.getElementById('tag').style.transform = `translateY(${(1 - tg) * 16}px)`;
  document.getElementById('sub').style.opacity = sb;
  document.getElementById('fade').style.opacity = 1 - seg(t, 0, .45) + seg(t, 9.6, 10);

  const [P, L] = camAt(t);
  camera.position.set(...P); camera.lookAt(...L);
  if (params.get('cam') === 'bike') { camera.position.set(bike.position.x + .5, 1.4, bike.position.z + 4.5); camera.lookAt(bike.position.x, .9, bike.position.z); }
  sun.target.position.set(0, 0, 0);
  if (composer) composer.render(); else renderer.render(scene, camera);
};
await document.fonts.load('800 34px Inter'); await document.fonts.load('500 22px Inter'); await document.fonts.load('800 30px Inter');
window.renderAt(0);
window.READY = true;
</script>
